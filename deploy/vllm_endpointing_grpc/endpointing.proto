syntax = "proto3";

package endpointing.v1;

// Endpointing (turn-end) classification service.
service EndpointingService {
  // Predict returns one of: "<EOU>" | "<CONT_USER>" | "<UNADDRESSED>".
  rpc Predict(EndpointingRequest) returns (EndpointingResponse) {}
}

message EndpointingRequest {
  string request_id = 1;
  string session_id = 2;
  string lang = 3; // e.g. "en-US"
  Asr asr = 4;
  repeated HistoryTurn history = 5;
  Options options = 6;
  Meta meta = 7;
}

message Asr {
  string text = 1;
}

message HistoryTurn {
  Role role = 1;
  string text = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  USER = 1;
  ASSISTANT = 2;
}

message Options {
  bool treat_unaddressed_as_eou = 1;
  optional double eou_threshold = 2;
}

message Meta {
  string device_model = 1;
  string app_version = 2;
  map<string, string> extra = 100;
}

message EndpointingResponse {
  string request_id = 1;
  string label = 2;
  double confidence = 3;
  string model = 4;
  int32 latency_ms = 5;
  // Normalized probabilities within {<EOU>, <CONT_USER>, <UNADDRESSED>}
  double p_eou = 6;
  double p_cont_user = 7;
  double p_unaddressed = 8;
}

