### model
model_name_or_path: FunAudioLLM/Fun-Audio-Chat-8B
adapter_name_or_path: path/to/stage1_sft_adapter_or_merged_checkpoint
template: funaudiochat
stage: grpo
do_train: true
finetuning_type: lora
lora_target: all
additional_target: multi_modal_projector
freeze_multi_modal_projector: false
funaudiochat_freeze_audio_tower: true
flash_attn: fa2
bf16: true

### data
dataset: your_funaudiochat_train_dataset
eval_dataset: your_funaudiochat_eval_dataset
dataset_dir: data
cutoff_len: 2048
packing: false
dynamic_prompt_sampling: true
overwrite_cache: true
preprocessing_num_workers: 8

### audio
audio_sampling_rate: 16000
audio_padding: max_length

### output
output_dir: saves/funaudiochat/grpo_asr_lora
logging_steps: 5
save_strategy: steps
save_steps: 200
eval_strategy: steps
eval_steps: 200
save_total_limit: 5
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-7
max_steps: 1000
lr_scheduler_type: cosine
warmup_ratio: 0.02
ddp_find_unused_parameters: false
report_to: none

### grpo
grpo_num_generations: 4
grpo_max_completion_length: 256
grpo_beta: 0.04
grpo_temperature: 0.8
grpo_top_p: 0.95
grpo_repetition_penalty: 1.0
grpo_scale_rewards: group
grpo_loss_type: dapo
grpo_mask_truncated_completions: true
grpo_log_completions: true
grpo_use_vllm: true
grpo_vllm_mode: colocate
grpo_vllm_tensor_parallel_size: 1
grpo_vllm_gpu_memory_utilization: 0.3
grpo_vllm_enable_sleep_mode: false
grpo_reward_wer_weight: 1.0
grpo_reward_cer_weight: 0.25
grpo_empty_penalty: 1.0
grpo_repeat_penalty: 0.2
