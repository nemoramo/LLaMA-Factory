### model
model_name_or_path: google/gemma-3n-E2B-it
template: gemma3n
stage: sft
finetuning_type: lora
trust_remote_code: true

# 生成相关（评估用）
do_sample: false
temperature: 0.0
top_p: 1.0
num_beams: 1
max_new_tokens: 64

bf16: true
flash_attn: auto
do_train: true

freeze_vision_tower: true            # 防止 LoRA 命中 audio/vision 分支，保持它们全参
freeze_multi_modal_projector: true  # projector 仍然全参

### data
dataset: gemma3n_asr_nemo_train
eval_dataset: gemma3n_asr_nemo_dev
dataset_dir: /home/sagemaker-user/llama_data/
val_size: 0.0
cutoff_len: 512
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4
train_on_prompt: false
packing: false

### lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

# LLM 部分：对齐 Unsloth 的 target_modules
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  # - up_proj
  # - down_proj

# 额外全参子模块：HF 结构中的 audio_tower + multi_modal_projector
# 建议写成逗号分隔的字符串（与官方参数说明完全一致）
additional_target: audio_tower,multi_modal_projector

### training
output_dir: saves/gemma3n-e2b-asr-nemo/lora_debug
overwrite_output_dir: true

num_train_epochs: 2.0

per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8

learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
adam_beta2: 0.95
max_grad_norm: 1.0
gradient_checkpointing: false

logging_steps: 10
eval_strategy: steps
eval_steps: 10
save_steps: 1000
save_total_limit: 2
load_best_model_at_end: false

ddp_timeout: 1800
ddp_find_unused_parameters: false

seed: 42
report_to: tensorboard
audio_padding: longest
eval_num_samples: 10