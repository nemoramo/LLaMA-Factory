# Qwen3-ASR SFT (audio -> text), Full fine-tuning (single GPU)
# Sample config - please update paths marked with <UPDATE_ME>

### model
model_name_or_path: <UPDATE_ME>/saves/qwen3_asr/hausa_full_ft_50k_lr1e-5_audioep/checkpoint-44000
template: qwen3_asr
trust_remote_code: false

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: full
flash_attn: fa2
bf16: true

### dataset
dataset_dir: <UPDATE_ME>/manifests/llama_data/qwen3_asr/hausa_all_full_20260122_openai_audio
dataset: hausa_all_full_20260122_train
eval_dataset: hausa_test_return_data,hausa_test_fleurs,hausa_test_haiwa,hausa_test_youtube
eval_on_each_dataset: true
cutoff_len: 4096
preprocessing_num_workers: 8
preprocessing_batch_size: 8

# Packing (recommended):
packing: true
neat_packing: true
dynamic_prompt_packing: true
dynamic_prompt_sampling: true
dynamic_prompt_packing_buffer_size: 4096
dynamic_prompt_packing_prefetch_buffers: 2
dynamic_prompt_packing_carryover_packs: 2
dynamic_prompt_packing_log_interval: 10

# Log data progress in audio-hours/epochs.
log_audio_epochs: true

### audio
audio_sampling_rate: 16000
audio_padding: longest

### output
output_dir: <UPDATE_ME>/saves/qwen3_asr/hausa_full_ft_50k_bs4ga4_lr3e-5_audioep
overwrite_output_dir: false
logging_steps: 20

save_strategy: steps
save_steps: 1000
save_total_limit: 5

### eval
eval_strategy: steps
eval_steps: 500
predict_with_generate: true
compute_wer_cer: true
eval_num_samples: 16
eval_loss_on_full_dataset: false

### generate (for WER)
do_sample: false
num_beams: 1
max_new_tokens: 256

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
per_device_eval_batch_size: 1
learning_rate: 3.0e-5
max_steps: 50000
lr_scheduler_type: cosine
warmup_ratio: 0.02
report_to: none

### perf
dataloader_num_workers: 6
dataloader_prefetch_factor: 4
