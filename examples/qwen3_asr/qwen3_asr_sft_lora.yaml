# Example: Qwen3-ASR SFT (audio -> text), LoRA fine-tuning

### model
model_name_or_path: Qwen/Qwen3-ASR-1.7B
template: qwen3_asr
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
flash_attn: fa2
bf16: true

### lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### dataset
# Replace these with your dataset settings.
dataset_dir: data
dataset: your_qwen3_asr_dataset_name
cutoff_len: 4096
preprocessing_num_workers: 8

# Packing (recommended):
packing: true
dynamic_prompt_packing: true

### audio
audio_sampling_rate: 16000
audio_padding: longest

### output
output_dir: saves/qwen3_asr/qwen3_asr_sft_lora
overwrite_output_dir: false
logging_steps: 10
save_strategy: steps
save_steps: 1000

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.02
report_to: none

