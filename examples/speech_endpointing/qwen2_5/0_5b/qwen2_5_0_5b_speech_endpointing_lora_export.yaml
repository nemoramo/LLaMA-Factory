### Note: DO NOT use quantized model or quantization_bit when merging LoRA adapters

### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
# Set to your trained LoRA output dir (same as `output_dir` in train config).
adapter_name_or_path: /path/to/lora_adapter_dir
template: qwen
trust_remote_code: true

# Keep tokenizer/model vocab consistent with training
add_special_tokens: "<EOU>,<CONT_USER>,<UNADDRESSED>"
resize_vocab: true

### export
export_dir: /path/to/export_dir
export_size: 2
export_device: cpu  # choices: [cpu, auto]
export_legacy_format: false
