### model
model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
template: qwen
trust_remote_code: true

# Add 3 label tokens and resize embeddings (vocab expansion)
add_special_tokens: "<EOU>,<CONT_USER>,<UNADDRESSED>"
resize_vocab: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora

# Evaluate as token-level accuracy (recommended: keep assistant output as single tag token)
compute_accuracy: true
predict_with_generate: false

### lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

### dataset
# Point to your dataset_info.json directory
dataset_dir: /path/to/your/dataset_dir
dataset: speech_endpointing_train
eval_dataset: speech_endpointing_eval
cutoff_len: 512
train_on_prompt: false

# Enable packing + neat packing (no cross-sample loss contribution)
packing: true
neat_packing: true

overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /path/to/output/qwen2_5_0_5b/speech_endpointing_lora_neat_packing
overwrite_output_dir: true
report_to: tensorboard
plot_loss: true
logging_steps: 10

save_steps: 1000
save_total_limit: 3

eval_strategy: steps
eval_steps: 1000

load_best_model_at_end: true
metric_for_best_model: eval_accuracy
greater_is_better: true

### train
# 0.5B fits larger micro-batches on H20; keep the same effective batch (=64) as 3B recipe.
per_device_train_batch_size: 32
per_device_eval_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
num_train_epochs: 1.0

bf16: true
ddp_find_unused_parameters: false

### inference (recommended for endpointing)
do_sample: false
temperature: 0.0
top_p: 1.0
num_beams: 1
max_new_tokens: 1
